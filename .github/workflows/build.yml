name: Build SnapMitra for Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests (layout, text overlay, guides, export, ...)
        shell: pwsh
        run: |
          python tools/fetch_model.py
          $env:SM_MODEL_DIR = "$PWD\models"
          python tests/run_tests.py
        env:
          PYTHONIOENCODING: utf-8
        continue-on-error: true      # informational: the build below has its own hard self-test
      - name: Download AI models (they are bundled INSIDE the app - it never downloads anything)
        run: python tools/fetch_model.py
      - name: Build SnapMitra (PyInstaller spec)
        run: pyinstaller --noconfirm SnapMitra.spec
      - name: Self-test the built app (AI + face + text + guides + stamp size + PNG/JPG/PDF)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SnapMitra\SnapMitra.exe" `
                 -ArgumentList "--selftest","$PWD\tests\sample_portrait.png","$PWD\selftest_out" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\SnapMitra\log.txt" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest_out\selftest.pdf)) { Write-Error "SELF-TEST FAILED"; exit 1 }
      - name: Start the real window for 12 seconds (crash check)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "dist\SnapMitra\SnapMitra.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { Write-Error "SnapMitra window exited early (code $($p.ExitCode))"; exit 1 }
          Write-Host "Window stayed open - OK"; Stop-Process -Id $p.Id -Force
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\SnapMitra -DestinationPath SnapMitra-portable.zip
      - name: Build installer (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: SnapMitra-Windows
          path: |
            installer_out/SnapMitra-Setup.exe
            SnapMitra-portable.zip
          if-no-files-found: warn
