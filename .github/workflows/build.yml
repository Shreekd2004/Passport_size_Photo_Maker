name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download AI model (gets bundled inside the app, so the app never downloads anything)
        run: python tools/fetch_model.py
      - name: Build app folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --name PassportPhotoMaker `
            --add-data "models;models" `
            --collect-all onnxruntime --collect-all tkinterdnd2 --collect-all sv_ttk --collect-data cv2 `
            --hidden-import win32print --hidden-import win32ui `
            main.py
      - name: Self-test the built app (AI + face + sheet + save)
        shell: pwsh
        run: |
          python tools/make_sample.py sample.png
          $p = Start-Process -FilePath "dist\PassportPhotoMaker\PassportPhotoMaker.exe" `
                 -ArgumentList "--selftest","$PWD\sample.png","$PWD\selftest.png" -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\PassportPhotoMaker\log.txt" -ErrorAction SilentlyContinue | Select-Object -Last 15
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest.png)) { Write-Error "SELF-TEST FAILED"; exit 1 }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\PassportPhotoMaker -DestinationPath PassportPhotoMaker-portable.zip
      - name: Build installer (optional)
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: PassportPhotoMaker-Windows
          path: |
            installer_out/PassportPhotoMaker-Setup.exe
            PassportPhotoMaker-portable.zip
          if-no-files-found: warn
